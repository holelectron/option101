name: Render Korean option101 podcast

on:
  workflow_dispatch:
    inputs:
      preview:
        description: "Render only the first four dialogue turns for a quick test"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'podcast/EP01-charts-and-gamma.md'
      - 'scripts/render_option101_podcast.py'
      - '.github/workflows/render-option101-podcast.yml'

permissions:
  contents: write

concurrency:
  group: option101-podcast
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and audio renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install 'edge-tts>=7,<9' 'pydub>=0.25,<1'
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Validate renderer syntax
        run: python -m py_compile scripts/render_option101_podcast.py
      - name: Render dialogue audio
        env:
          PREVIEW: ${{ inputs.preview }}
        run: |
          if [ "$PREVIEW" = "true" ]; then
            python scripts/render_option101_podcast.py --max-turns 4 --output docs/public/podcast/ep01-preview.mp3
          else
            python scripts/render_option101_podcast.py --output docs/public/podcast/ep01.mp3
          fi
      - name: Upload audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: option101-ep01-audio
          path: docs/public/podcast/*.mp3
          if-no-files-found: error
      - name: Commit finished MP3 to Pages source
        if: ${{ inputs.preview != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/public/podcast/ep01.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Publish option101 conversational podcast EP01 audio"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
