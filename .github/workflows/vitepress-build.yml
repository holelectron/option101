name: Validate VitePress Site
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/prepare-site.mjs'
      - 'scripts/translate_skylit_gpt.py'
      - 'TRANSLATION_GLOSSARY.md'
      - 'package.json'
      - '.github/workflows/vitepress-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check translation script syntax
        run: python -m py_compile scripts/translate_skylit_gpt.py
      - name: Install VitePress
        run: npm install --no-audit --no-fund
      - name: Build bilingual documentation
        run: npm run docs:build
      - name: Upload private preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: option101-vitepress-site
          path: docs/.vitepress/dist
          retention-days: 7
