name: Improve Korean Translations (GPT)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum articles (0 = all 42)'
        required: true
        default: '0'
        type: string

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify translation API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret OPENAI_API_KEY is not configured."
            exit 1
          fi
      - name: Install OpenAI Python SDK
        run: python -m pip install 'openai>=2,<4'
      - name: Translate and validate remaining 42 documents
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSLATION_MODEL: gpt-6.1-sol
          LIMIT: ${{ inputs.limit }}
        run: python scripts/translate_skylit_gpt.py --write --limit "$LIMIT"
      - name: Commit validated translations and quality report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+holelectron@users.noreply.github.com"
          git add docs/skylit/translation_quality_report.json || true
          find docs/skylit -name '*.ko.md' -print0 | xargs -0 -r git add
          if ! git diff --cached --quiet; then
            git commit -m "Improve Korean translations with GPT and term glossary"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
