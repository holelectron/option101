name: Archive Skylit Learn
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_skylit.py'
      - 'requirements.txt'
      - '.github/workflows/archive-skylit.yml'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download original HTML and Markdown
        run: python scripts/sync_skylit.py
      - name: Commit downloaded content
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d docs/skylit ]; then
            git add docs/skylit
            if ! git diff --cached --quiet; then
              git commit -m "Archive Skylit Learn articles"
              git push
            fi
          fi
